name: Verify live v1.10 deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  RELEASE_SHA: 5a6d5475c6982f27917d432f4e5e2d33ab949ef4
  PROJECT_NAME: socialgame-2fo

jobs:
  verify-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-live-v110
          fetch-depth: 0

      - name: Package exact v1.10 release
        shell: bash
        run: |
          set -euo pipefail
          node tests/verify-release.mjs
          rm -rf dist
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const manifest=JSON.parse(fs.readFileSync('build-manifest.json','utf8'));
          if(manifest.version!=='1.10.0')throw new Error(`Unexpected release ${manifest.version}`);
          for(const source of manifest.files){
            const destination=path.join('dist',source);
            fs.mkdirSync(path.dirname(destination),{recursive:true});
            fs.copyFileSync(source,destination);
          }
          NODE

      - name: Resolve Cloudflare account
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          account_id="${CLOUDFLARE_ACCOUNT_ID_SECRET:-}"
          npx --yes wrangler@4 whoami 2>&1 | tee /tmp/whoami.txt
          if [ -z "$account_id" ]; then account_id=$(grep -Eo '[0-9a-fA-F]{32}' /tmp/whoami.txt | head -n1 || true); fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy exact merged commit
        id: deploy
        shell: bash
        env:
          RESOLVED_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          if [ -n "${RESOLVED_ACCOUNT_ID:-}" ]; then export CLOUDFLARE_ACCOUNT_ID="$RESOLVED_ACCOUNT_ID"; fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-message 'Sakura Crest v1.10 dedicated real-assets release' 2>&1 | tee /tmp/deploy.txt
          deployment_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/deploy.txt | head -n1 || true)
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "canonical_url=https://$PROJECT_NAME.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Validate live v1.10 and every dedicated asset
        shell: bash
        env:
          CANONICAL_URL: ${{ steps.deploy.outputs.canonical_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          live_url="$CANONICAL_URL"
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/?verify=$RELEASE_SHA" -o /tmp/index.html; then
            live_url="$DEPLOYMENT_URL"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/?verify=$RELEASE_SHA" -o /tmp/index.html
          fi
          grep -q 'Sakura Crest' /tmp/index.html
          grep -q '1.10.0' /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/assets/anime/manifest.json?verify=$RELEASE_SHA" -o /tmp/anime-manifest.json
          jq -e '.version == "1.10.0" and .proceduralFallbacks == false and .externalRuntimeDependency == false and (.assets | has("district-map.webp") and has("world-locations.webp") and has("events.webp") and has("rivals.webp") and has("memories.webp"))' /tmp/anime-manifest.json >/dev/null
          for asset in district-map world-locations events rivals memories; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/assets/anime/$asset.webp?verify=$RELEASE_SHA" -o "/tmp/$asset.webp"
            test $(stat -c%s "/tmp/$asset.webp") -gt 100000
          done
          cat > live-v110-verification.json <<JSON
          {
            "verified": true,
            "release": "1.10.0",
            "commit": "$RELEASE_SHA",
            "project": "$PROJECT_NAME",
            "liveUrl": "$live_url",
            "deploymentUrl": "$DEPLOYMENT_URL",
            "proceduralFallbacks": false,
            "externalRuntimeDependency": false,
            "dedicatedAssets": {
              "districtMapBytes": $(stat -c%s /tmp/district-map.webp),
              "worldLocationsBytes": $(stat -c%s /tmp/world-locations.webp),
              "eventsBytes": $(stat -c%s /tmp/events.webp),
              "rivalsBytes": $(stat -c%s /tmp/rivals.webp),
              "memoriesBytes": $(stat -c%s /tmp/memories.webp)
            }
          }
          JSON
          cat live-v110-verification.json

      - name: Preserve verification result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-live-v110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record verified live v1.10 deployment'
          git push origin HEAD:verify-live-v110
