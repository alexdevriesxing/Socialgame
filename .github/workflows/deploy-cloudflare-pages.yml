name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PROJECT_SECRET: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
  CLOUDFLARE_PROJECT_VARIABLE: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v1.10 production artifact
        run: node tests/verify-release.mjs

      - name: Build exact Pages upload directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const manifest=JSON.parse(fs.readFileSync('build-manifest.json','utf8'));
          if(manifest.version!=='1.10.0')throw new Error(`Refusing to deploy release ${manifest.version}.`);
          for(const source of manifest.files){
            const destination=path.join('dist',source);
            fs.mkdirSync(path.dirname(destination),{recursive:true});
            fs.copyFileSync(source,destination);
          }
          console.log(`Prepared ${manifest.files.length} files for Cloudflare Pages.`);
          NODE
          test -s dist/index.html
          test -s dist/assets/anime/keyart.webp
          test -s dist/assets/anime/campus.webp
          test -s dist/assets/anime/characters.webp
          test -s dist/assets/anime/district-map.webp
          test -s dist/assets/anime/world-locations.webp
          test -s dist/assets/anime/events.webp
          test -s dist/assets/anime/rivals.webp
          test -s dist/assets/anime/memories.webp
          test -s dist/_headers
          test -s dist/_redirects

      - name: Resolve Cloudflare account and Pages project
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2; exit 1; }
          account_id="${CLOUDFLARE_ACCOUNT_ID_SECRET:-}"
          npx --yes wrangler@4 whoami > /tmp/whoami.txt
          cat /tmp/whoami.txt
          if [ -z "$account_id" ]; then account_id=$(grep -Eo '[0-9a-fA-F]{32}' /tmp/whoami.txt | head -n1 || true); fi
          if [ -n "$account_id" ]; then export CLOUDFLARE_ACCOUNT_ID="$account_id"; fi
          npx --yes wrangler@4 pages project list --json > /tmp/projects.json
          cat /tmp/projects.json
          project="${CLOUDFLARE_PROJECT_VARIABLE:-${CLOUDFLARE_PROJECT_SECRET:-}}"
          if [ -z "$project" ]; then
            project=$(jq -r 'if type=="array" then ([.[] | select((((.name // .Name // "") | ascii_downcase) | test("socialgame|sakura|crest")))] | first | (.name // .Name // empty)) else empty end' /tmp/projects.json 2>/dev/null || true)
          fi
          if [ -z "$project" ]; then project='sakura-crest-social-summit'; fi
          if ! jq -e --arg p "$project" 'type=="array" and any(.[]; ((.name // .Name // "") == $p))' /tmp/projects.json >/dev/null 2>&1; then
            npx --yes wrangler@4 pages project create "$project" --production-branch main
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare Pages project: $project" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production release
        id: deploy
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.cloudflare.outputs.project }}
          RESOLVED_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          if [ -n "${RESOLVED_ACCOUNT_ID:-}" ]; then export CLOUDFLARE_ACCOUNT_ID="$RESOLVED_ACCOUNT_ID"; fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'Sakura Crest v1.10 dedicated real-assets release' 2>&1 | tee /tmp/deploy.txt
          deployment_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/deploy.txt | head -n1 || true)
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "canonical_url=https://$PROJECT_NAME.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Verify live v1.10 artwork
        shell: bash
        env:
          CANONICAL_URL: ${{ steps.deploy.outputs.canonical_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          live_url="$CANONICAL_URL"
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/?verify=$GITHUB_SHA" -o /tmp/index.html; then
            live_url="$DEPLOYMENT_URL"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/?verify=$GITHUB_SHA" -o /tmp/index.html
          fi
          grep -q 'Sakura Crest' /tmp/index.html
          grep -q '1.10.0' /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/assets/anime/manifest.json?verify=$GITHUB_SHA" -o /tmp/anime-manifest.json
          jq -e '.version == "1.10.0" and .proceduralFallbacks == false and .externalRuntimeDependency == false and (.assets | has("district-map.webp") and has("world-locations.webp") and has("events.webp") and has("rivals.webp") and has("memories.webp"))' /tmp/anime-manifest.json >/dev/null
          for asset in district-map world-locations events rivals memories; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "$live_url/assets/anime/$asset.webp?verify=$GITHUB_SHA" -o "/tmp/$asset.webp"
            test $(stat -c%s "/tmp/$asset.webp") -gt 100000
          done
          echo "Cloudflare production deployment succeeded: $live_url" >> "$GITHUB_STEP_SUMMARY"
