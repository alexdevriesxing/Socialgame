name: Patch Living District static canvas fallback

on:
  push:
    branches:
      - agent/v19-dedicated-scene-art

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v19-dedicated-scene-art
          fetch-depth: 0
      - name: Add radial-gradient fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/living-district-v111.js')
          text=path.read_text(encoding='utf-8')
          old="const glow=ctx.createRadialGradient(945,155,5,945,155,150);glow.addColorStop(0,'rgba(255,222,185,.28)');glow.addColorStop(1,'rgba(255,222,185,0)');ctx.fillStyle=glow;ctx.fillRect(760,55,360,310);"
          new="const glow=ctx.createRadialGradient?.(945,155,5,945,155,150);if(glow?.addColorStop){glow.addColorStop(0,'rgba(255,222,185,.28)');glow.addColorStop(1,'rgba(255,222,185,0)');ctx.fillStyle=glow;}else ctx.fillStyle='rgba(255,222,185,.12)';ctx.fillRect(760,55,360,310);"
          if old not in text: raise SystemExit('radial-gradient source marker not found')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Commit fallback
        run: |
          rm -f .github/workflows/patch-v111-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add static canvas fallback for district ambience'
          git push origin HEAD:agent/v19-dedicated-scene-art
