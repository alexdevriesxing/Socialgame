name: Apply v1.10 release registration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/real-asset-completion-v110'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-asset-completion-v110
          fetch-depth: 0
      - run: python3 tools/register_real_assets_v110.py
      - run: |
          node tests/verify-release.mjs
          node tests/social-memory-v19-smoke.mjs
          node tests/remote-static-smoke.mjs
      - name: Commit normalized release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize v1.10 release metadata'
          git push origin HEAD:agent/real-asset-completion-v110
