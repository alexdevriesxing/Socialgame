name: Patch v1.11 remote runtime smoke

on:
  push:
    branches:
      - agent/v19-dedicated-scene-art

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v19-dedicated-scene-art
          fetch-depth: 0
      - name: Update release and Living District assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/remote-static-smoke.mjs')
          text=path.read_text(encoding='utf-8')
          text=text.replace("if(window.SAKURA_RELEASE?.version!=='1.10.0')throw new Error(`Unexpected release marker ${window.SAKURA_RELEASE?.version}.`);", "if(window.SAKURA_RELEASE?.version!=='1.11.0')throw new Error(`Unexpected release marker ${window.SAKURA_RELEASE?.version}.`);")
          marker="const animeArtValidation=validateAnimeArtV18();if(!animeArtValidation.valid||animeArtValidation.externalRuntimeDependency!==false||animeArtValidation.proceduralFallbacks!==false||animeArtValidation.characterCount!==16||animeArtValidation.campusWings!==3)throw new Error(`Anime art integration invalid: ${JSON.stringify(animeArtValidation)}`);"
          addition=marker+"\nconst livingDistrictValidation=validateLivingDistrictV111();if(!livingDistrictValidation.valid||livingDistrictValidation.signatureActivities!==14||livingDistrictValidation.uniqueAmbientProfiles!==14||livingDistrictValidation.placeholderAssets!==false)throw new Error(`Living District integration invalid: ${JSON.stringify(livingDistrictValidation)}`);"
          if marker not in text: raise SystemExit('anime art validation marker not found')
          text=text.replace(marker,addition)
          text=text.replace('permanent v1.10 dedicated real artwork', 'permanent v1.11 Living District artwork and progression')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit patched smoke test
        run: |
          rm -f .github/workflows/patch-v111-remote-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align remote runtime smoke with Living District v1.11'
          git push origin HEAD:agent/v19-dedicated-scene-art
