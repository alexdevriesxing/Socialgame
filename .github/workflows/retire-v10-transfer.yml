name: Retire obsolete v1.0 transfer workflows

on:
  push:
    branches:
      - agent/deep-social-memory-v19-runtime

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/deep-social-memory-v19-runtime
          fetch-depth: 0

      - name: Remove retired transfer workflows
        run: |
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -qE '^name: (Export v1\.0 release fragments|Import Leadership & Legacy v1\.0)$' "$file"; then
              echo "Removing $file"
              rm "$file"
            fi
          done
          rm .github/workflows/retire-v10-transfer.yml

      - name: Commit workflow retirement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          git commit -m "Retire obsolete v1.0 transfer workflows"
          git push origin HEAD:agent/deep-social-memory-v19-runtime
