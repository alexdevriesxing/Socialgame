name: Gameplay CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - '_headers'
      - '.github/workflows/gameplay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pillow

      - name: Run complete validation suite
        id: validation
        shell: bash
        run: |
          set +e
          npm run check > validation.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 100 validation.log
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-validation-log
          path: validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1

      - name: Upload Cloudflare Pages build
        if: steps.validation.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: socialgame-cloudflare-pages
          path: dist/
          if-no-files-found: error
          retention-days: 14
