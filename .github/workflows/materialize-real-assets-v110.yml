name: Materialize dedicated real assets v1.10

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/real-asset-completion-v110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout asset-completion branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-asset-completion-v110
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Build permanent artwork
        run: python3 tools/materialize_real_assets_v110.py

      - name: Register release files
        run: python3 tools/register_real_assets_v110.py

      - name: Verify image dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image
          expected={'district-map.webp':(1536,1024),'world-locations.webp':(1536,1024),'events.webp':(800,600),'rivals.webp':(800,600),'memories.webp':(800,600)}
          for name,size in expected.items():
              image=Image.open('assets/anime/'+name);image.load();assert image.size==size,(name,image.size,size);print(name,image.size,image.mode)
          PY

      - name: Record release verifier output
        shell: bash
        run: |
          set -o pipefail
          node tests/verify-release.mjs 2>&1 | tee materializer-verify.log || true

      - name: Commit permanent v1.10 artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize dedicated real assets v1.10'
          git push origin HEAD:agent/real-asset-completion-v110
