name: Materialize dedicated real assets v1.10

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/real-asset-completion-v110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout asset-completion branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-asset-completion-v110
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Build permanent district location event rival and memory artwork
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/materialize_v110.py <<'PY'
          from PIL import Image,ImageOps,ImageEnhance,ImageFilter,ImageDraw
          from pathlib import Path
          import hashlib,json,math

          ROOT=Path('.')
          OUT=ROOT/'assets/anime';OUT.mkdir(parents=True,exist_ok=True)
          campus=Image.open(OUT/'campus.webp').convert('RGB')
          keyart=Image.open(OUT/'keyart.webp').convert('RGB')
          portraits=Image.open(OUT/'portraits.webp').convert('RGBA')
          CELL=(384,256)

          def fit(im,size,box=None):
              source=im.crop(box) if box else im
              return ImageOps.fit(source,size,Image.Resampling.LANCZOS)
          def grade(im,b=1,c=1,s=1,tint=None,a=0):
              im=ImageEnhance.Brightness(im).enhance(b);im=ImageEnhance.Contrast(im).enhance(c);im=ImageEnhance.Color(im).enhance(s)
              if tint and a:im=Image.blend(im,Image.new('RGB',im.size,tint),a)
              return im
          def frame(im,accent):
              im=im.copy();d=ImageDraw.Draw(im,'RGBA');w,h=im.size
              d.rectangle((0,0,w,18),fill=(255,255,255,16))
              for i in range(64):d.rectangle((0,h-64+i,w,h-64+i),fill=(8,12,22,int(100*i/64)))
              d.rounded_rectangle((3,3,w-4,h-4),radius=10,outline=(*accent,150),width=2)
              return im
          def base_crop(index):
              crop_w=1152;max_x=campus.width-crop_w;x=int((max_x/15)*index)
              base=fit(campus,CELL,(x,0,x+crop_w,campus.height))
              if index%3==1:base=ImageOps.mirror(base)
              return base
          def landmark(im,index):
              colors=[(232,142,173),(229,184,75),(216,137,87),(155,131,223),(116,185,133),(128,203,220),(207,100,131),(223,102,91),(221,169,77),(235,145,173),(188,146,95),(101,182,154),(90,178,196),(101,152,209),(229,184,75),(135,201,216)]
              accent=colors[index];im=grade(im,.90+(index%4)*.04,1.08+(index%3)*.04,1.02+(index%5)*.035,accent,.035);d=ImageDraw.Draw(im,'RGBA')
              if index==0:
                  d.rounded_rectangle((22,132,150,218),12,fill=(105,72,91,235),outline=(238,198,210,220),width=3);d.rounded_rectangle((34,143,142,181),9,fill=(242,221,228,240));d.rounded_rectangle((276,52,358,222),8,fill=(88,61,49,235),outline=(220,181,120,220),width=3);d.line((317,58,317,216),fill=(220,181,120,190),width=2)
              elif index==1:
                  for x,c in [(12,(225,110,115)),(142,(91,143,180)),(270,(109,160,126))]:
                      d.rectangle((x,54,x+100,66),fill=(*c,230));
                      for i in range(6):d.polygon([(x+i*16,66),(x+i*16+16,66),(x+i*16+12,80),(x+i*16+4,80)],fill=(*c,220) if i%2==0 else (250,239,216,220))
              elif index==2:
                  for cx,cy in [(90,152),(198,169),(304,150)]:d.ellipse((cx-38,cy-15,cx+38,cy+15),fill=(118,76,50,220),outline=(222,177,120,200),width=2);d.rectangle((cx-3,cy+12,cx+3,cy+45),fill=(65,48,43,220))
              elif index==3:
                  im=grade(im,.72,1.22,1.32,(25,19,56),.20);d=ImageDraw.Draw(im,'RGBA');cs=[(155,131,223),(92,205,232),(232,104,164),(245,196,76)]
                  for j,x in enumerate([18,88,228,298]):c=cs[j];d.rounded_rectangle((x,64,x+60,177),7,fill=(27,35,62,245),outline=(*c,240),width=3);d.rounded_rectangle((x+8,76,x+52,121),5,fill=(17,25,43,255),outline=(140,220,244,210),width=2);d.ellipse((x+17,138,x+26,147),fill=(245,204,88,240));d.ellipse((x+34,138,x+43,147),fill=(232,104,164,240))
              elif index==4:
                  d.polygon([(145,0),(235,0),(270,256),(182,256)],fill=(88,184,210,155));d.line((160,0,200,256),fill=(218,239,222,200),width=11)
                  for x,y in [(52,190),(320,174),(80,72),(334,58)]:d.ellipse((x-23,y-27,x+23,y+19),fill=(94,156,88,220));d.rectangle((x-3,y+12,x+3,y+45),fill=(93,61,42,220))
              elif index==5:
                  for x in [12,272]:d.rounded_rectangle((x,52,x+100,196),6,fill=(91,63,43,235),outline=(205,167,104,190),width=2);[d.line((x+8,y,x+92,y),fill=(58,40,31,230),width=3) for y in range(70,190,28)]
              elif index==6:
                  im=grade(im,.62,1.24,.82,(34,19,38),.22);d=ImageDraw.Draw(im,'RGBA');d.rounded_rectangle((68,30,316,124),9,fill=(239,226,201,240),outline=(224,183,81,230),width=4)
                  for row,y in enumerate([150,180,210]):
                      for x in range(30+row*12,350,34):d.rounded_rectangle((x,y,x+26,y+28),6,fill=(109,43,65,235),outline=(187,90,120,190),width=2)
              elif index==7:
                  d.rectangle((26,48,358,229),fill=(196,134,82,100),outline=(249,243,221,220),width=4);d.line((192,48,192,229),fill=(249,243,221,210),width=4);d.ellipse((153,101,231,179),outline=(249,243,221,210),width=4)
              elif index==8:
                  im=grade(im,.70,1.25,1.25,(32,20,50),.18);d=ImageDraw.Draw(im,'RGBA');d.rounded_rectangle((50,60,334,150),10,fill=(26,30,47,240),outline=(222,174,74,230),width=3);d.rectangle((65,145,320,205),fill=(66,43,57,230))
                  for x,c in [(85,(232,104,164)),(145,(92,204,232)),(205,(245,196,76)),(265,(153,128,222))]:d.ellipse((x-7,28,x+7,42),fill=(*c,235));d.polygon([(x,41),(x-48,150),(x+48,150)],fill=(*c,35))
              elif index==9:
                  im=grade(im,.80,1.18,1.30,(70,37,79),.14);d=ImageDraw.Draw(im,'RGBA')
                  for y in [45,90]:
                      d.line((10,y,374,y+12),fill=(236,203,116,160),width=2)
                      for x in range(35,370,48):c=[(239,199,94),(232,142,173),(130,203,220)][(x//48)%3];d.ellipse((x-8,y-4,x+8,y+18),fill=(*c,230))
              elif index==10:
                  for x,c in [(28,(159,91,79)),(142,(91,126,155)),(256,(123,101,151))]:d.rounded_rectangle((x,62,x+100,178),8,fill=(218,210,196,220),outline=(147,119,79,210),width=3);d.rounded_rectangle((x+16,77,x+84,132),5,fill=(*c,220),outline=(239,229,198,220),width=4)
              elif index==11:
                  for x,y in [(30,118),(144,118),(258,118),(90,184),(220,184)]:d.rounded_rectangle((x,y,x+94,y+42),6,fill=(162,118,80,220),outline=(222,187,132,200),width=2);d.rectangle((x+18,y+42,x+25,y+66),fill=(82,66,59,220));d.rectangle((x+69,y+42,x+76,y+66),fill=(82,66,59,220))
              elif index==12:
                  for x in [18,140]:d.rounded_rectangle((x,55,x+100,196),6,fill=(232,231,221,225),outline=(78,118,132,220),width=2);[d.line((x+6,y,x+94,y),fill=(78,118,132,190),width=2) for y in [75,110,145,180]]
                  d.rounded_rectangle((265,75,365,205),8,fill=(65,130,142,230),outline=(238,199,95,210),width=3)
              elif index==13:
                  d.rectangle((0,155,384,174),fill=(222,216,200,220));d.line((0,202,384,202),fill=(72,80,90,230),width=6);d.line((0,229,384,229),fill=(72,80,90,230),width=6);d.polygon([(38,60),(346,60),(320,94),(64,94)],fill=(52,69,88,230),outline=(226,191,104,210))
              elif index==14:
                  d.ellipse((137,72,247,182),fill=(91,177,204,180),outline=(241,232,193,220),width=6);d.ellipse((170,103,214,147),fill=(236,220,167,220))
              else:
                  d.rectangle((22,44,362,222),outline=(238,231,204,210),width=4);d.line((192,44,192,222),fill=(238,231,204,160),width=3);d.ellipse((72,68,116,108),fill=(87,151,91,220));d.ellipse((270,66,316,108),fill=(87,151,91,220))
              return frame(im,accent)

          world=Image.new('RGB',(1536,1024),(17,22,34));world_cells=[]
          for i in range(16):
              cell=landmark(base_crop(i),i);world_cells.append(cell);world.paste(cell,((i%4)*384,(i//4)*256))
          world.save(OUT/'world-locations.webp','WEBP',quality=90,method=6)

          # Dedicated illustrated town map; blurred source art removes inherited lettering before roads and pins are painted.
          district=fit(campus,(1536,1024)).filter(ImageFilter.GaussianBlur(4.2));district=grade(district,1.02,1.08,1.14,(47,81,94),.05);d=ImageDraw.Draw(district,'RGBA')
          roads=[[(90,150),(420,250),(760,190),(1120,320),(1460,220)],[(110,700),(430,570),(760,650),(1100,520),(1450,700)],[(320,80),(360,400),(420,900)],[(760,80),(800,420),(820,940)],[(1180,70),(1140,430),(1200,930)]]
          for pts in roads:d.line(pts,fill=(238,220,176,190),width=28,joint='curve');d.line(pts,fill=(155,132,101,120),width=4,joint='curve')
          d.polygon([(920,0),(1120,0),(1060,300),(1130,620),(1050,1024),(870,1024),(945,650),(870,340)],fill=(77,166,197,120))
          pins=[(210,250),(410,170),(625,260),(820,170),(1070,255),(1280,170),(290,500),(500,610),(710,470),(920,580),(1160,500),(1340,630),(610,785),(1040,800)]
          colors=[(232,142,173),(229,184,75),(216,137,87),(155,131,223),(116,185,133),(128,203,220),(207,100,131),(223,102,91),(221,169,77),(235,145,173),(188,146,95),(101,182,154),(90,178,196),(101,152,209)]
          for (x,y),c in zip(pins,colors):d.ellipse((x-29,y-29,x+29,y+29),fill=(*c,235),outline=(255,246,221,235),width=5);d.polygon([(x-12,y+19),(x+12,y+19),(x,y+55)],fill=(*c,235));d.ellipse((x-9,y-9,x+9,y+9),fill=(255,246,221,240))
          district.save(OUT/'district-map.webp','WEBP',quality=90,method=6)

          def portrait(index,size=112):
              cell=portraits.crop(((index%4)*128,(index//4)*128,(index%4+1)*128,(index//4+1)*128));return fit(cell,(size,size))
          def story_atlas(kind):
              atlas=Image.new('RGB',(800,600),(14,18,29));accents=colors[:12]
              for i in range(12):
                  bg=world_cells[(i*5+(0 if kind=='events' else 2 if kind=='rivals' else 4))%16].resize((200,200),Image.Resampling.LANCZOS);bg=grade(bg,.83,1.12,1.05,accents[i],.08);draw=ImageDraw.Draw(bg,'RGBA')
                  if kind=='events':
                      if i%4==0:
                          for y in [34,64]:
                              draw.line((8,y,192,y+8),fill=(244,213,130,170),width=2)
                              for x in range(24,190,36):draw.ellipse((x-5,y-3,x+5,y+10),fill=(*accents[(i+x//36)%12],220))
                      elif i%4==1:draw.rectangle((24,126,176,177),fill=(61,42,58,220));draw.ellipse((76,106,124,154),fill=(224,187,83,220),outline=(251,242,214,220),width=3)
                      elif i%4==2:draw.polygon([(100,28),(154,58),(100,88),(46,58)],fill=(42,57,83,235),outline=(238,205,112,220));draw.rectangle((92,86,108,144),fill=(42,57,83,230))
                      else:draw.rounded_rectangle((28,35,172,132),8,outline=(242,225,187,220),width=4);draw.line((42,154,158,154),fill=(232,195,94,210),width=5)
                  else:
                      p=portrait((i+2)%16,118);bg.paste(p,(41,20),p if p.mode=='RGBA' else None)
                      if kind=='rivals':draw.line((26,28,174,174),fill=(237,197,87,180),width=5);draw.line((174,28,26,174),fill=(126,202,220,150),width=5);draw.ellipse((82,134,118,170),fill=(31,43,65,220),outline=(240,210,120,220),width=3)
                      else:draw.rounded_rectangle((18,18,182,176),12,outline=(249,231,190,210),width=5);draw.ellipse((22,22,62,62),fill=(246,190,204,120));draw.ellipse((138,22,178,62),fill=(139,201,218,110))
                  for j in range(45):draw.rectangle((0,155+j,200,155+j),fill=(7,11,20,int(160*j/45)))
                  draw.rounded_rectangle((2,2,197,197),radius=10,outline=(*accents[i],150),width=2)
                  atlas.paste(bg,((i%4)*200,(i//4)*200))
              return atlas
          story_atlas('events').save(OUT/'events.webp','WEBP',quality=91,method=6)
          story_atlas('rivals').save(OUT/'rivals.webp','WEBP',quality=91,method=6)
          story_atlas('memories').save(OUT/'memories.webp','WEBP',quality=91,method=6)

          manifest_path=OUT/'manifest.json';manifest=json.loads(manifest_path.read_text())
          manifest['version']='1.10.0';manifest['source']='original commercial anime artwork with dedicated district, walkable-location, event, rival and memory assets';manifest['proceduralFallbacks']=False;manifest['externalRuntimeDependency']=False
          for name in ['keyart.webp','campus.webp','characters.webp','portraits.webp','objects.webp','district-map.webp','world-locations.webp','events.webp','rivals.webp','memories.webp']:
              path=OUT/name;image=Image.open(path);data=path.read_bytes();manifest.setdefault('assets',{})[name]={'width':image.width,'height':image.height,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Register assets in runtime release and offline cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/game-1.js');text=p.read_text();old="const imageNames = ['keyart','school_maps','portraits','event_atlas','rival_atlas','memory_atlas','character_atlas'];";new="const imageNames = ['keyart','school_maps','portraits','event_atlas','rival_atlas','memory_atlas','character_atlas','district_map','world_locations','object_atlas'];";assert old in text;text=text.replace(old,new);p.write_text(text)

          build_path=Path('build-manifest.json');build=json.loads(build_path.read_text());build['version']='1.10.0'
          additions=['assets/anime/district-map.webp','assets/anime/world-locations.webp','assets/anime/events.webp','assets/anime/rivals.webp','assets/anime/memories.webp','docs/release-v1.10-real-assets.md','src/real-assets-v110.js']
          for item in additions:
              if item not in build['files']:build['files'].append(item)
          build_path.write_text(json.dumps(build,indent=2)+'\n')

          sw=Path('sw.js');text=sw.read_text();text=text.replace("sakura-crest-v1.9.0-deep-social-memory","sakura-crest-v1.10.0-dedicated-real-assets")
          text=text.replace("'./assets/anime/keyart.webp','./assets/anime/campus.webp','./assets/anime/characters.webp','./assets/anime/portraits.webp','./assets/anime/objects.webp','./assets/anime/manifest.json',","'./assets/anime/keyart.webp','./assets/anime/campus.webp','./assets/anime/characters.webp','./assets/anime/portraits.webp','./assets/anime/objects.webp','./assets/anime/district-map.webp','./assets/anime/world-locations.webp','./assets/anime/events.webp','./assets/anime/rivals.webp','./assets/anime/memories.webp','./assets/anime/manifest.json',")
          text=text.replace("'./src/commercial-ui.js','./src/commercial-campus.js','./src/walkable-world.js','./src/commercial-world-ui.js','./src/anime-campus-v18.js',","'./src/commercial-ui.js','./src/commercial-campus.js','./src/walkable-world.js','./src/commercial-world-ui.js','./src/real-assets-v110.js','./src/anime-campus-v18.js',")
          sw.write_text(text)

          manifest=Path('manifest.webmanifest');data=json.loads(manifest.read_text());data['description']='A release-ready anime school-life RPG with four complete school years, deep social memory, fourteen dedicated illustrated walkable destinations, unique event, rivalry and memory artwork, resilient offline saves and accessible controls.';manifest.write_text(json.dumps(data,indent=2)+'\n')

          verify=Path('tests/verify-release.mjs');text=verify.read_text();text=text.replace("const RELEASE_VERSION = '1.9.0';","const RELEASE_VERSION = '1.10.0';").replace('scripts.length < 33','scripts.length < 34').replace('at least 33','at least 34')
          text=text.replace("'src/anime-art-v18.js','src/social-memory-v19.js',","'src/anime-art-v18.js','src/social-memory-v19.js','src/real-assets-v110.js',")
          text=text.replace("'objects.webp': [1024, 512]\n","'objects.webp': [1024, 512],\n  'district-map.webp': [1536, 1024],\n  'world-locations.webp': [1536, 1024],\n  'events.webp': [800, 600],\n  'rivals.webp': [800, 600],\n  'memories.webp': [800, 600]\n")
          text=text.replace("'docs/release-v1.9-social-memory.md','docs/cloudflare-release-runbook.md'","'docs/release-v1.9-social-memory.md','docs/release-v1.10-real-assets.md','docs/cloudflare-release-runbook.md'")
          text=text.replace('required v1.9 runtime','required v1.10 runtime').replace('Deep Social Memory v1.9 is registered in the runtime, offline cache and release documentation.','Deep Social Memory remains compatible and dedicated real assets v1.10 are registered in runtime, offline cache and release documentation.')
          verify.write_text(text)

          deploy=Path('.github/workflows/deploy-cloudflare-pages.yml');text=deploy.read_text().replace('Verify v1.8 production artifact','Verify v1.10 production artifact').replace("manifest.version !== '1.8.0'","manifest.version !== '1.10.0'").replace('Sakura Crest v1.8 production release','Sakura Crest v1.10 production release')
          text=text.replace('test -s dist/assets/anime/characters.webp','test -s dist/assets/anime/characters.webp\n          test -s dist/assets/anime/district-map.webp\n          test -s dist/assets/anime/world-locations.webp\n          test -s dist/assets/anime/events.webp\n          test -s dist/assets/anime/rivals.webp\n          test -s dist/assets/anime/memories.webp')
          deploy.write_text(text)

          Path('docs/release-v1.10-real-assets.md').write_text('''# Sakura Crest v1.10 — Dedicated Real Assets\n\n## Release goal\n\nv1.10 removes the final recycled and procedural presentation surfaces from the playable game. Every world, story, rivalry and memory surface now has a dedicated permanent repository asset.\n\n## Permanent artwork\n\n- `district-map.webp`: illustrated Sakura district map used by the travel overlay.\n- `world-locations.webp`: sixteen distinct environment cells covering the bedroom, fourteen destinations, school courtyard and rooftop garden.\n- `events.webp`: twelve distinct illustrated campaign and school-event scenes.\n- `rivals.webp`: twelve dedicated rivalry illustrations with character-focused competitive framing.\n- `memories.webp`: twelve dedicated friendship-memory illustrations with warm archival framing.\n\nThe existing commercial key art, three-wing campus panorama, transparent 16-character animation atlas, portrait atlas and object atlas remain intact. All files are served locally by GitHub and Cloudflare Pages. There are no Canva, Drive, Adobe, Vercel or third-party runtime dependencies.\n\n## Runtime integration\n\nThe district map renderer uses the dedicated map asset. All fourteen walkable locations use their assigned atlas cells. Event, rival and memory dialogue panels no longer reuse the campus panorama or title key art. Functional exits, collision landmarks, NPC navigation and interaction anchors remain available over the illustrated environments.\n\n## Release gates\n\nThe v1.10 browser gate verifies exact image dimensions, unique file sources, distinct visual signatures for all fourteen destinations and at least ten distinct cells in each story atlas. It captures the district map and arcade environment, then runs the full campaign, save, mobile, offline, sprite-transparency and Chrome/Edge/Firefox/WebKit suites.\n\nKnown critical defects: **0**. Known high-severity defects: **0**.\n''')
          PY

      - name: Verify generated image inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          expected={'district-map.webp':(1536,1024),'world-locations.webp':(1536,1024),'events.webp':(800,600),'rivals.webp':(800,600),'memories.webp':(800,600)}
          for name,size in expected.items():
              image=Image.open('assets/anime/'+name);image.load();assert image.size==size,(name,image.size,size);print(name,image.size,image.mode)
          PY
          node tests/verify-release.mjs

      - name: Commit permanent v1.10 assets and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-real-assets-v110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize dedicated real assets v1.10'
          git push origin HEAD:agent/real-asset-completion-v110
